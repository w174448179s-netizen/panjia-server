worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream backend {
        server server:8080;
    }

    server {
        listen 80 default_server;
        server_name _;

        # 自定义错误页面（后端不可用时展示友好中文提示）
        error_page 502 503 504 /502.html;
        location = /502.html {
            root /var/www/panjia-error;
            internal;
        }

        # 前端静态文件
        location / {
            root /var/www/panjia-ui;
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存
        location /assets/ {
            root /var/www/panjia-ui;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # 生产环境 API 前缀 /prod-api → 后端（去掉前缀）
        location /prod-api/ {
            rewrite ^/prod-api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # SSE / WebSocket 消息推送（关闭缓冲）
        location /resource/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
        }

        # Spring Boot Actuator / API 文档
        location /actuator/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # MinIO 图片/文件直链（sys_oss_config.domain_url = http://服务器IP/oss）
        # /oss/ruoyi/xxx.png → minio:9000/ruoyi/xxx.png（去前缀）
        # resolver + 变量 proxy_pass：外置 MinIO 模式（无 minio 容器）时本段 502，
        # 不拖垮 nginx 启动（upstream/静态 proxy_pass 解析失败会直接起不来）
        location /oss/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            # set 必须在 rewrite break 之前：break 会终止后续 rewrite 阶段指令，
            # set 放在后面会永远不执行，导致 proxy_pass 拿到空值报 500 invalid URL prefix
            set $minio_upstream http://minio:9000;
            rewrite ^/oss/(.*)$ /$1 break;
            proxy_pass $minio_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
    }
}
