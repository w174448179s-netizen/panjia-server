# Docker 本地运行时覆盖配置（--spring.profiles.active=dev,docker-local）
# 容器内通过 host.docker.internal 连接宿主机上 docker-compose 跑的中間件
# 数据库独立：Docker 后端用 panjia_test 测试库，IDE 开发用 postgres 开发库，互不影响

spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:postgresql://host.docker.internal:5432/panjia_test?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true&stringtype=unspecified
  # Flyway 独立数据源（绕过 dynamic-datasource，application.yml 里写死 localhost，需同步覆盖）
  flyway:
    url: jdbc:postgresql://host.docker.internal:5432/panjia_test
  data:
    redis:
      host: host.docker.internal
      port: 6379

# MinIO（panjia-server/script/docker/docker-compose.yml 已暴露 9000 到宿主机）
panjia:
  import-util:
    minio:
      endpoint: http://host.docker.internal:9000
  # 备份恢复：容器内无 docker CLI，改用本机 postgresql-client 直连宿主机 PG；
  # 镜像（Dockerfile.local）已内置 postgresql-client-16，备份/还原目标均为 panjia_test
  backup:
    mode: local
    db-host: host.docker.internal
    db-port: 5432
    db-name: panjia_test
    db-user: root
    db-pass: root
