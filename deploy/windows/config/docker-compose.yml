services:
  postgres:
    image: postgres:16.9
    container_name: panjia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-panjia}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: panjia-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?err} --appendonly yes
    environment:
      # 供 healthcheck 在容器内 shell 展开使用
      REDIS_PASSWORD: ${REDIS_PASSWORD:?err}
    volumes:
      - ../data/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    image: panjia-server:${IMAGE_TAG:-latest}
    container_name: panjia-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-panjia}?useUnicode=true&characterEncoding=utf8&useSSL=false&autoReconnect=true&reWriteBatchedInserts=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${POSTGRES_USER:?err}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${POSTGRES_PASSWORD:?err}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-panjia}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:?err}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?err}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?err}
      SPRING_DATA_REDIS_DATABASE: 0
      REDISSON_SINGLESERVERCONFIG_PASSWORD: ${REDIS_PASSWORD:?err}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC}
      PANJIA_LICENSE_SERVER_URL: ${PANJIA_LICENSE_SERVER_URL:-https://panjia.icu}
      PANJIA_AUTH_CODE: ${PANJIA_AUTH_CODE:-}
      PANJIA_LICENSE_DATA_DIR: /data/panjia-license
    volumes:
      # 授权机器指纹：install.ps1 从 Windows 注册表 MachineGuid 生成（ASCII 无 BOM）
      - ../config/machine-id:/etc/machine-id:ro
      - ../logs:/ruoyi/server/logs
      - ../data/panjia-license:/data/panjia-license
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    image: nginx:stable-alpine
    container_name: panjia-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../web/dist:/var/www/panjia-ui:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
