services:
  postgres:
    image: postgres:16.9
    container_name: panjia-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-panjia}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # 只绑宿主机回环：容器间走内网，外部仅能通过 SSH 隧道访问，不对公网暴露
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: panjia-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?err} --appendonly yes
    environment:
      # 供 healthcheck 在容器内 shell 展开使用
      REDIS_PASSWORD: ${REDIS_PASSWORD:?err}
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    # 默认随 compose 一起启动（COMPOSE_PROFILES=embedded-minio）；
    # 改用外部独立 MinIO 服务器时，.env 里 COMPOSE_PROFILES 留空即可，本服务不启动
    profiles: ["embedded-minio"]
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: panjia-minio
    restart: always
    environment:
      TZ: Asia/Shanghai
      # 弱默认值仅兜底：内置模式由 .env 注入随机强密码；外部模式此服务不启动
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-panjia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-panjia123456}
      MINIO_COMPRESS: "off"
      MINIO_COMPRESS_EXTENSIONS: ""
      MINIO_COMPRESS_MIME_TYPES: ""
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    command: server --address ':9000' --console-address ':9001' /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  server:
    image: panjia-server:${IMAGE_TAG:-latest}
    container_name: panjia-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # stringtype=unspecified：允许 MyBatis 以 String 绑定 JSONB 列（panjia 导入域 raw_json/column_json 等），与 application-dev.yml 保持一致
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-panjia}?useUnicode=true&characterEncoding=utf8&useSSL=false&autoReconnect=true&reWriteBatchedInserts=true&stringtype=unspecified
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${POSTGRES_USER:?err}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${POSTGRES_PASSWORD:?err}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-panjia}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:?err}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?err}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?err}
      SPRING_DATA_REDIS_DATABASE: 0
      REDISSON_SINGLESERVERCONFIG_PASSWORD: ${REDIS_PASSWORD:?err}
      # MinIO 对象存储（通用文件服务走后台 sys_oss_config 表配置；此处随导入归档变量联动）
      MINIO_ENDPOINT: ${PANJIA_IMPORT_MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${PANJIA_IMPORT_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-panjia}}
      MINIO_SECRET_KEY: ${PANJIA_IMPORT_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-panjia123456}}
      # MinIO 对象存储（导入归档 common-import-util 专用，属性名不同，必须单独配）
      # 内置容器默认 http://minio:9000；迁到独立服务器时在 .env 填外部地址+密钥即可
      PANJIA_IMPORT_MINIO_ENDPOINT: ${PANJIA_IMPORT_MINIO_ENDPOINT:-http://minio:9000}
      PANJIA_IMPORT_MINIO_ACCESS_KEY: ${PANJIA_IMPORT_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-panjia}}
      PANJIA_IMPORT_MINIO_SECRET_KEY: ${PANJIA_IMPORT_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-panjia123456}}
      PANJIA_IMPORT_MINIO_BUCKET: ${PANJIA_IMPORT_MINIO_BUCKET:-panjia-archive}
      # License 授权：首次部署配 PANJIA_AUTH_CODE 自动激活，token 落盘 data/panjia-license 后可留空
      PANJIA_AUTH_CODE: ${PANJIA_AUTH_CODE:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC}
    volumes:
      - ./logs:/ruoyi/server/logs
      - ./data/panjia-license:/data/panjia-license
      # License 机器指纹主因子：只读挂载宿主机 machine-id
      - /etc/machine-id:/etc/machine-id:ro
    # 只在容器内网暴露，不发布到宿主机：nginx 通过容器名 server:8080 反代，
    # 禁止绕过 nginx 从公网直连后端 API
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    image: nginx:stable-alpine
    container_name: panjia-web
    restart: always
    # 只等 server 容器启动（保证容器名 DNS 可解析），不等健康：
    # 后端没起来/重启循环时 nginx 照常服务静态页，API 返回 502 而不是整站打不开
    depends_on:
      server:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/error:/var/www/panjia-error:ro
      - ./web/dist:/var/www/panjia-ui:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
