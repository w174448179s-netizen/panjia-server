services:
  postgres:
    image: postgres:16.9
    container_name: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # 运行时数据（不提交 Git）
      - ./data/postgres:/var/lib/postgresql/data

  # 与 deploy/docker 生产部署完全同构的入口：同源服务 前端 + /prod-api + /oss
  # nginx.conf 直接复用 deploy/docker/nginx/nginx.conf（/prod-api → server:8080，
  # /oss → minio:9000；本地后端容器由 run-local-backend.sh 以 network-alias server 接入）
  web:
    image: nginx:stable-alpine
    container_name: panjia-local-web
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
    volumes:
      # 配置文件（与客户部署同一份，Git 提交）
      - ../../deploy/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 错误页（Git 提交）
      - ../../deploy/docker/nginx/error:/var/www/panjia-error:ro
      # 前端构建产物（pnpm build 输出，不提交 Git）
      - ../../../panjia-ui/dist:/var/www/panjia-ui:ro
      # 日志目录（不提交 Git）
      - ./data/nginx/log:/var/log/nginx

  redis:
    image: redis:8.6.3
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件（Git 提交，只读挂载）
      - ./config/redis:/redis/config:ro
      # 数据文件（不提交 Git）
      - ./data/redis/:/redis/data/:rw
    command: "redis-server /redis/config/redis.conf"
    privileged: true

  minio:
    # pgsty 开源社区 fork 重新维护的最新版 minio
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名
      MINIO_ROOT_USER: ruoyi
      # 管理后台密码，最小8个字符
      MINIO_ROOT_PASSWORD: ruoyi123
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 运行时数据（不提交 Git）
      - ./data/minio:/data
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
