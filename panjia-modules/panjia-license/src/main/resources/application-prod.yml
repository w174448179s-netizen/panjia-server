# 生产环境覆盖配置（由容器环境变量注入）
panjia:
  license:
    server-url: ${PANJIA_LICENSE_SERVER_URL:https://panjia.icu}
    # 授权码（首次部署注入，激活后作废）
    auth-code: ${PANJIA_AUTH_CODE:}
    product-version: ${panjia.version:1.0.0}
    # 数据目录（Docker 卷挂载点）
    data-dir: ${PANJIA_LICENSE_DATA_DIR:/data/panjia-license}
    # SSL Pinning 双指纹
    ssl-pinning:
      primary-fingerprint: ${PANJIA_PIN_FP_A:}
      secondary-fingerprint: ${PANJIA_PIN_FP_B:}
