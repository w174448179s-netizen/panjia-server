# ============================================================================
# 盘家智管 — Nginx HTTPS 模板（certbot / Let's Encrypt 自动签发）
#
# ★ 本文件是模板，不能直接使用：deploy.sh 在服务器上把 __DOMAIN__ 替换为真实
#   域名后生成 nginx-https.enabled.conf，并由 .env 的 NGINX_CONF 指定挂载。
#   无域名/测试环境仍用纯 HTTP 的 nginx.conf。
#
# 证书（certbot 管理，宿主机 /etc/letsencrypt 只读挂载进容器）：
#   /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
#   /etc/letsencrypt/live/__DOMAIN__/privkey.pem
# 续签：cron 每天 3 点 certbot renew --webroot -w 安装目录/acme，
#       80 端口的 /.well-known/acme-challenge/ 提供验证文件，成功后 nginx reload。
# ============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream backend {
        server server:8080;
    }

    # ---------- HTTP（80）：ACME 续签验证 + 健康检查 + 其余跳转 HTTPS ----------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt webroot 续签（宿主机 ./acme → /var/www/certbot）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 容器健康检查（compose healthcheck 用；不能探 /，/ 会 301 到
        # https://127.0.0.1 导致证书 CN 不匹配，健康检查永远失败）
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- 默认 HTTPS server：未匹配 host（如直接用 IP 访问 443）直接断开 ----------
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 444;
    }

    # ---------- 正式站点 ----------
    server {
        listen 443 ssl;
        server_name __DOMAIN__ www.__DOMAIN__;

        ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 自定义错误页面（后端不可用时展示友好中文提示）
        error_page 502 503 504 /502.html;
        location = /502.html {
            root /var/www/panjia-error;
            internal;
        }

        # 前端静态文件
        location / {
            root /var/www/panjia-ui;
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存
        location /assets/ {
            root /var/www/panjia-ui;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # 生产环境 API 前缀 /prod-api → 后端（去掉前缀）
        location /prod-api/ {
            rewrite ^/prod-api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # SSE / WebSocket 消息推送（关闭缓冲）
        location /resource/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
        }

        # Spring Boot Actuator / API 文档
        location /actuator/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 可选扩展：宿主机若挂载了 ./nginx/extra，则加载其中的 location 片段
        # 标准交付不带该目录，glob 无匹配时 nginx 正常启动（不影响通用部署）
        include /etc/nginx/extra/*.conf;

        # MinIO 图片/文件直链（sys_oss_config.domain_url = https://域名/oss）
        # /oss/ruoyi/xxx.png → minio:9000/ruoyi/xxx.png（去前缀）
        # resolver + 变量 proxy_pass：外置 MinIO 模式（无 minio 容器）时本段 502，
        # 不拖垮 nginx 启动（upstream/静态 proxy_pass 解析失败会直接起不来）
        location /oss/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            # set 必须在 rewrite break 之前：break 会终止后续 rewrite 阶段指令，
            # set 放在后面会永远不执行，导致 proxy_pass 拿到空值报 500 invalid URL prefix
            set $minio_upstream http://minio:9000;
            rewrite ^/oss/(.*)$ /$1 break;
            proxy_pass $minio_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
    }
}
